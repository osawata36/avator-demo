<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カメラ連動アバターデモ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
:root{color-scheme:light;--bg1:#f7eaee;--bg2:#e6dff2;--bg3:#eaf1de;--ink:#5a3f33;--ink-soft:#8a6f63;
  --panel:rgba(255,255,255,.72);--panel-line:rgba(90,63,51,.14);--accent:#8b5e4b;--accent-ink:#fff8f3;--dot:#e36a7c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#2b2230;--bg2:#262a3a;--bg3:#29302a;--ink:#f1e3d8;--ink-soft:#c3ada0;--panel:rgba(30,24,34,.72);--panel-line:rgba(241,227,216,.14);--accent:#d9a68e;--accent-ink:#2b1d16}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#2b2230;--bg2:#262a3a;--bg3:#29302a;--ink:#f1e3d8;--ink-soft:#c3ada0;--panel:rgba(30,24,34,.72);--panel-line:rgba(241,227,216,.14);--accent:#d9a68e;--accent-ink:#2b1d16}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);overflow:hidden}
*{box-sizing:border-box}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;perspective:1400px;perspective-origin:50% 35%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:150px}
.sparkles{position:absolute;inset:0;pointer-events:none;opacity:.55}
.sparkles i{position:absolute;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
/* character canvas: 1100 x 1800 units */
.char{position:relative;width:min(78vw,52vh,520px);aspect-ratio:1100/1800;transform-origin:50% 70%;will-change:transform}
.grp,.ly{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.grp{transform-style:preserve-3d;will-change:transform}
.ly img{position:absolute;display:block;max-width:none}
.ly.hide{display:none}
.hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--panel-line)}
.hud h1{font-size:15px;font-weight:700;margin:0 auto 0 0;letter-spacing:.02em}
.hud h1 small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--dot);outline-offset:2px}
button[disabled]{opacity:.5;cursor:default}
label.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.cam{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;background:#000;flex:none;border:1px solid var(--panel-line)}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;transform:scaleX(-1)}
.msg{font-size:12px;color:var(--ink-soft);flex-basis:100%;min-height:1em;line-height:1.5}
@media (max-width:480px){.hud h1{font-size:14px}.char{width:min(84vw,46vh)}}
</style>
</head>

<div class="hud">
  <h1>カメラ連動アバター<small id="mode">顔の向き・まばたき・口の開きに連動します</small></h1>
  <div class="cam"><video id="vid" playsinline muted autoplay></video><canvas id="cv" width="96" height="72" hidden></canvas></div>
  <label class="sw"><input type="checkbox" id="mic"> 声でも口を動かす</label>
  <button id="start">カメラを開始</button>
  <div class="msg" id="msg">「カメラを開始」を押すと、インカメラとマイクの許可を求めます。映像は端末内だけで処理され、どこにも送信されません。</div>

<script type="module">
{const sp=document.getElementById('sp');for(let i=0;i<22;i++){const s=document.createElement('i');const r=4+Math.random()*10;
 s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${r}px;height:${r}px;opacity:${.3+Math.random()*.7}`;sp.appendChild(s);}}

const CW=1100,CH=1800;
const $=id=>document.getElementById(id);
const META={"tail": [313, 1285, 174, 390], "backhair": [60, 59, 1000, 1282], "legs": [300, 1180, 521, 571], "body": [92, 602, 936, 605], "head": [228, 107, 663, 666], "fronthair": [95, 72, 930, 856], "ears": [228, 67, 663, 666], "star": [708, 266, 103, 89]};   // layer -> [x,y,w,h] in canvas units
function placeBox(id,x,y,w,h,flip){const img=$(id).querySelector('img');
  img.style.left=x/CW*100+'%';img.style.top=y/CH*100+'%';img.style.width=w/CW*100+'%';img.style.height=h/CH*100+'%';
  if(flip)img.style.transform='scaleX(-1)';}
for(const k in META){const [x,y,w,h]=META[k];placeBox(k,x,y,w,h,false);}
// face parts in head-part coordinates -> canvas
const HX=META.head[0],HY=META.head[1];
function placeC(id,cx,cy,w,h,flip){placeBox(id,HX+cx-w/2,HY+cy-h/2,w,h,flip);}
placeBox('lids',HX+124,HY+354,502,183,false);
placeC('eyeL',236,432,192,77,true);
placeC('eyeR',524,432,192,77,false);
placeC('mH',385,570,84,55,false);
placeC('mO',385,576,76,77,false);
// pivots
const NECK={x:560,y:770};
$('gHead').style.transformOrigin=`${NECK.x/CW*100}% ${NECK.y/CH*100}%`;
$('gHair').style.transformOrigin=`50% ${430/CH*100}%`;
$('gBack').style.transformOrigin=`${NECK.x/CW*100}% ${600/CH*100}%`;
$('gBody').style.transformOrigin=`50% ${1200/CH*100}%`;
$('tail').style.transformOrigin=`${(META.tail[0]+META.tail[2]*.5)/CW*100}% ${(META.tail[1]+META.tail[3])/CH*100}%`;

const S={x:0,y:0,yaw:0,pitch:0,roll:0,size:0,tx:0,ty:0,tyaw:0,tpitch:0,troll:0,tsize:0,
  mouth:0,tmouth:0,jaw:0,blinkL:0,blinkR:0,tblinkL:0,tblinkR:0,ml:false,autoBlink:true,hx:0,hy:0,hr:0};
const msg=$('msg'),modeEl=$('mode'),video=$('vid');
let base=null,lastSeen=0;
function scheduleBlink(){setTimeout(()=>{if(S.autoBlink){S.tblinkL=S.tblinkR=1;setTimeout(()=>{S.tblinkL=S.tblinkR=0;},120);}scheduleBlink();},2000+Math.random()*4000);}
scheduleBlink();

let landmarker=null;
async function loadML(){
  const VER='0.10.14';
  const mod=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/vision_bundle.mjs`);
  const vision=await mod.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts=delegate=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate},
    outputFaceBlendshapes:true,runningMode:'VIDEO',numFaces:1});
  try{landmarker=await mod.FaceLandmarker.createFromOptions(vision,opts('GPU'));}
  catch(e){landmarker=await mod.FaceLandmarker.createFromOptions(vision,opts('CPU'));}
  S.ml=true;S.autoBlink=false;
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function trackML(now){
  const r=landmarker.detectForVideo(video,now);
  if(!r.faceLandmarks||!r.faceLandmarks.length){if(now-lastSeen>800)S.autoBlink=true;return;}
  lastSeen=now;S.autoBlink=false;
  const L=r.faceLandmarks[0];
  const nose=L[1],cR=L[234],cL=L[454],eR=L[33],eL=L[263],top=L[10],chin=L[152];
  const mid={x:(cR.x+cL.x)/2,y:(cR.y+cL.y)/2};
  const width=dist(cR,cL)||1e-3,height=dist(top,chin)||1e-3;
  const yaw=(nose.x-mid.x)/width, pitch=(nose.y-mid.y)/height, roll=Math.atan2(eL.y-eR.y,eL.x-eR.x);
  if(!base)base={x:mid.x,y:mid.y,yaw,pitch,roll,width};
  S.tx=-(mid.x-base.x);S.ty=mid.y-base.y;
  S.tyaw=yaw-base.yaw;S.tpitch=pitch-base.pitch;S.troll=roll-base.roll;
  S.tsize=Math.max(-.5,Math.min(.9,width/base.width-1));
  const bs={};if(r.faceBlendshapes&&r.faceBlendshapes.length)for(const c of r.faceBlendshapes[0].categories)bs[c.categoryName]=c.score;
  S.tblinkL=(bs.eyeBlinkLeft||0)>.45?1:0;S.tblinkR=(bs.eyeBlinkRight||0)>.45?1:0;
  S.jaw=Math.min(1,Math.max(0,((bs.jawOpen||0)-.06)*2.2));
}
const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
function trackSkin(){
  ctx.drawImage(video,0,0,cv.width,cv.height);const d=ctx.getImageData(0,0,cv.width,cv.height).data;
  let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){const i=(y*cv.width+x)*4,R=d[i],G=d[i+1],B=d[i+2];
    const Y=.299*R+.587*G+.114*B,cb=128-.1687*R-.3313*G+.5*B,cr=128+.5*R-.4187*G-.0813*B;
    if(Y>50&&cr>136&&cr<176&&cb>78&&cb<126&&R>G&&R>B){n++;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;}}
  if(n<40)return;const cx=sx/n,cy=sy/n,vx=sxx/n-cx*cx,vy=syy/n-cy*cy,cxy=sxy/n-cx*cy;
  let ang=.5*Math.atan2(2*cxy,vx-vy);if(vx>vy)ang+=Math.PI/2;if(ang>Math.PI/2)ang-=Math.PI;if(ang<-Math.PI/2)ang+=Math.PI;
  const size=Math.sqrt(n/(cv.width*cv.height));if(!base)base={x:cx/cv.width,y:cy/cv.height,size};
  S.tx=-(cx/cv.width-base.x);S.ty=cy/cv.height-base.y;S.troll=-ang*.6;S.tyaw=S.tx*2;
  S.tsize=Math.max(-.5,Math.min(.9,(size-base.size)/Math.max(base.size,.05)));
}
let analyser=null,buf=null;
function micLevel(){if(!analyser||!$('mic').checked)return 0;analyser.getByteTimeDomainData(buf);let s=0;
  for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v;}return Math.min(1,Math.max(0,(Math.sqrt(s/buf.length)-.02)*9));}

let running=false,t0=performance.now();
const cl=(v,m)=>Math.max(-m,Math.min(m,v));
function loop(now){
  if(running&&video.readyState>=2){try{if(landmarker)trackML(now);else trackSkin();}catch(e){console.warn(e);}}
  S.tmouth=Math.max(S.ml&&running?S.jaw:0,micLevel());
  const k=.22;for(const p of ['x','y','yaw','pitch','roll','size'])S[p]+=(S['t'+p]-S[p])*k;
  S.mouth+=(S.tmouth-S.mouth)*.4;S.blinkL+=(S.tblinkL-S.blinkL)*.6;S.blinkR+=(S.tblinkR-S.blinkR)*.6;
  const t=(now-t0)/1000, breath=Math.sin(t*2*Math.PI/4.5);
  // whole character: position + distance
  const dx=cl(S.x*520,150), dy=cl(S.y*260,70), sc=1+cl(S.size*.5,.35)+breath*.006;
  $('char').style.transform=`translate3d(${dx}px,${dy}px,0) scale(${sc})`;
  // head: turn + tilt + nod, around the neck
  const ry=cl(-S.yaw*70,28), rx=cl(S.pitch*45,16), rz=cl(S.roll*180/Math.PI*.9,22);
  const hdx=cl(-S.yaw*60,26), hdy=cl(S.pitch*40,14);
  $('gHead').style.transform=`translate3d(${hdx}px,${hdy}px,0) rotateZ(${rz}deg) rotateY(${ry}deg) rotateX(${rx}deg)`;
  // front hair + ears: a little extra parallax so the turn reads
  $('gHair').style.transform=`translate3d(${cl(-S.yaw*18,10)}px,${cl(S.pitch*10,5)}px,0)`;
  // body: follows the head slightly
  $('gBody').style.transform=`rotateZ(${rz*.25}deg) translate3d(${hdx*.2}px,0,0)`;
  // back hair & tail: lag + sway
  S.hr+=((rz*.5)-S.hr)*.08;
  $('gBack').style.transform=`rotateZ(${S.hr}deg) translate3d(${hdx*.35}px,${breath*2}px,0)`;
  $('tail').style.transform=`rotateZ(${Math.sin(t*1.6)*4+ry*.15}deg)`;
  const bl=S.blinkL>.5,br=S.blinkR>.5;
  $('lids').classList.toggle('hide',!(bl||br));
  $('lids').style.clipPath=(bl&&br)?'none':bl?'inset(0 50% 0 0)':'inset(0 0 0 50%)';
  $('eyeL').classList.toggle('hide',!bl);$('eyeR').classList.toggle('hide',!br);
  $('mO').classList.toggle('hide',!(S.mouth>.5));$('mH').classList.toggle('hide',!(S.mouth>.15&&S.mouth<=.5));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const btn=$('start');
btn.addEventListener('click',async()=>{
  btn.disabled=true;msg.textContent='許可を待っています…';let stream;
  try{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:true});}
    catch(e){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});msg.textContent='マイクなしで開始します。';}}
  catch(err){btn.disabled=false;
    msg.textContent=(err&&err.name==='NotAllowedError')?'カメラの許可が得られませんでした。Safari のアドレスバー左「ぁあ」→ Web サイトの設定でカメラを「許可」にして、再読み込みしてください。':'カメラを開けませんでした（'+(err&&err.name||'不明なエラー')+'）。';return;}
  video.srcObject=stream;await video.play();
  if(stream.getAudioTracks().length){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(stream);
    analyser=ac.createAnalyser();analyser.fftSize=512;buf=new Uint8Array(analyser.fftSize);src.connect(analyser);}catch(e){}}
  msg.textContent='顔認識モデルを読み込んでいます（初回は数秒かかります）…';
  try{await loadML();modeEl.textContent='顔認識: MediaPipe Face Landmarker';msg.textContent='追跡中。正面を向いた瞬間の姿勢が基準になります。ずれたら「位置をリセット」を押してください。';}
  catch(e){console.warn(e);modeEl.textContent='顔認識: 簡易モード（肌色追跡）';msg.textContent='顔認識モデルを読み込めなかったため簡易モードで動きます。';$('mic').checked=true;}
  running=true;base=null;btn.textContent='位置をリセット';btn.disabled=false;
  btn.onclick=()=>{base=null;msg.textContent='正面を向いた状態で基準をとり直しました。';};
});
</script>
</body>
