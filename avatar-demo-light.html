<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カメラ連動アバターデモ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg1:#f7eaee; --bg2:#e6dff2; --bg3:#eaf1de;
  --ink:#5a3f33; --ink-soft:#8a6f63;
  --panel:rgba(255,255,255,.72); --panel-line:rgba(90,63,51,.14);
  --accent:#8b5e4b; --accent-ink:#fff8f3;
  --dot:#e36a7c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg1:#2b2230; --bg2:#262a3a; --bg3:#29302a;
    --ink:#f1e3d8; --ink-soft:#c3ada0;
    --panel:rgba(30,24,34,.72); --panel-line:rgba(241,227,216,.14);
    --accent:#d9a68e; --accent-ink:#2b1d16;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#2b2230; --bg2:#262a3a; --bg3:#29302a;
  --ink:#f1e3d8; --ink-soft:#c3ada0;
  --panel:rgba(30,24,34,.72); --panel-line:rgba(241,227,216,.14);
  --accent:#d9a68e; --accent-ink:#2b1d16;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);overflow:hidden}
*{box-sizing:border-box}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
.sparkles{position:absolute;inset:0;pointer-events:none;opacity:.55}
.sparkles i{position:absolute;width:10px;height:10px;background:currentColor;color:#fff;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.rig{position:relative;width:min(78vw,52vh,560px);aspect-ratio:900/1133;transform-origin:50% 85%;will-change:transform}
.rig img.base{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:100%}
.layer{position:absolute;transform-origin:center;pointer-events:none;display:none}
.layer.on{display:block}
.layer img{width:100%;height:100%;display:block;max-width:100%}
.lid{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,#fee8d6 55%,#fcd5c4 100%);filter:blur(1px);display:none}
.lid.on{display:block}

.hud{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--panel-line)}
.hud h1{font-size:15px;font-weight:700;margin:0 auto 0 0;letter-spacing:.02em}
.hud h1 small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--dot);outline-offset:2px}
button[disabled]{opacity:.5;cursor:default}
label.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.cam{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;background:#000;flex:none;border:1px solid var(--panel-line)}
.cam canvas{width:100%;height:100%;display:block;transform:scaleX(-1)}
.cam .pt{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 2px #fff;transform:translate(-50%,-50%);display:none}
.msg{font-size:12px;color:var(--ink-soft);flex-basis:100%;min-height:1em}
@media (max-width:480px){.hud h1{font-size:14px}.rig{width:min(84vw,46vh)}}
@media (prefers-reduced-motion: reduce){.rig{transition:none}}
</style>
</head>

<div class="hud">
  <h1>カメラ連動アバター<small>顔の位置・傾き・距離で動き、声で口が開きます</small></h1>
  <div class="cam"><canvas id="cv" width="96" height="72"></canvas><div class="pt" id="pt"></div></div>
  <label class="sw"><input type="checkbox" id="mic" checked> 声で口を動かす</label>
  <button id="start">カメラを開始</button>
  <button id="pop" type="button" style="display:none;background:transparent;color:var(--accent);border:1.5px solid var(--accent)">別タブで開く</button>
  <div class="msg" id="msg">「カメラを開始」を押すと、インカメラとマイクの許可を求めます。映像は端末内だけで処理されます。</div>
</div>

<script>
// ---- sparkles ----
(function(){const sp=document.getElementById('sp');for(let i=0;i<22;i++){const s=document.createElement('i');
 const r=4+Math.random()*10;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${r}px;height:${r}px;opacity:${.3+Math.random()*.7}`;sp.appendChild(s);}})();

// ---- face-part placement (character space: 900 x 1133) ----
const W=900;
const rig=document.getElementById('rig');
function place(el,cx,cy,w,h,flip){
  el.style.left=(cx-w/2)/W*100+'%';el.style.top=(cy-h/2)/W*100+'%';
  el.style.width=w/W*100+'%';el.style.height=h/W*100+'%';
  if(flip)el.style.transform='scaleX(-1)';
}
// eye centres measured on the base image (viewer's left / right)
const EL={x:425,y:400}, ER={x:620,y:400};
place(document.getElementById('lidL'),EL.x,EL.y+3,118,94,false);
place(document.getElementById('lidR'),ER.x,ER.y+3,118,94,false);
place(document.getElementById('eyeL'),EL.x,EL.y-10,140,56,true);
place(document.getElementById('eyeR'),ER.x+2,ER.y-10,140,56,false);
const MOUTH={x:560,y:492};
place(document.getElementById('mH'),MOUTH.x,MOUTH.y+2,66,43,false);
place(document.getElementById('mO'),MOUTH.x,MOUTH.y+8,60,61,false);

// ---- state ----
const S={x:0,y:0,tilt:0,size:0,tx:0,ty:0,ttilt:0,tsize:0,mouth:0,tmouth:0,blink:false,tracking:false};
const msg=document.getElementById('msg');

// blink timer
function scheduleBlink(){setTimeout(()=>{S.blink=true;setTimeout(()=>{S.blink=false;scheduleBlink();},130);},1800+Math.random()*4000);}
scheduleBlink();

// ---- camera tracking (skin-colour moments; no ML model) ----
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const pt=document.getElementById('pt');
const video=document.createElement('video');video.playsInline=true;video.muted=true;
let base=null; // calibration reference
function track(){
  if(video.readyState<2)return;
  ctx.drawImage(video,0,0,cv.width,cv.height);
  const d=ctx.getImageData(0,0,cv.width,cv.height).data;
  let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){
    const i=(y*cv.width+x)*4,r=d[i],g=d[i+1],b=d[i+2];
    const Y=.299*r+.587*g+.114*b, cb=128-.1687*r-.3313*g+.5*b, cr=128+.5*r-.4187*g-.0813*b;
    if(Y>50&&cr>136&&cr<176&&cb>78&&cb<126&&r>g&&r>b){n++;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;
      d[i]=255;d[i+1]=d[i+2]=d[i+2]*.6;}
  }
  const img=new ImageData(d,cv.width,cv.height);ctx.putImageData(img,0,0);
  if(n<40){S.tracking=false;pt.style.display='none';return;}
  const cx=sx/n,cy=sy/n;
  const vx=sxx/n-cx*cx,vy=syy/n-cy*cy,cxy=sxy/n-cx*cy;
  let ang=.5*Math.atan2(2*cxy,vx-vy);        // ellipse orientation
  // orientation is defined on the long axis; a face is taller than wide, so measure tilt from vertical
  if(vx>vy)ang+=Math.PI/2; if(ang>Math.PI/2)ang-=Math.PI; if(ang<-Math.PI/2)ang+=Math.PI;
  const size=Math.sqrt(n/(cv.width*cv.height));
  if(!base)base={x:cx,y:cy,size};
  S.tracking=true;
  pt.style.display='block';pt.style.left=(1-cx/cv.width)*100+'%';pt.style.top=cy/cv.height*100+'%';
  S.tx=-(cx-base.x)/cv.width;  // mirrored: lean the way the viewer leans
  S.ty=(cy-base.y)/cv.height;
  S.ttilt=-ang;
  S.tsize=Math.max(-.5,Math.min(.8,(size-base.size)/Math.max(base.size,.05)));
}

// ---- microphone -> mouth ----
let analyser=null,buf=null;
function mouthFromMic(){
  if(!analyser||!document.getElementById('mic').checked){S.tmouth=0;return;}
  analyser.getByteTimeDomainData(buf);
  let s=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v;}
  const rms=Math.sqrt(s/buf.length);
  S.tmouth=Math.min(1,Math.max(0,(rms-.02)*9));
}

// ---- render loop ----
const eyeL=document.getElementById('eyeL'),eyeR=document.getElementById('eyeR'),lidL=document.getElementById('lidL'),lidR=document.getElementById('lidR');
const mH=document.getElementById('mH'),mO=document.getElementById('mO');
let frame=0,t0=performance.now();
function loop(now){
  frame++;
  if(frame%2===0)track();
  mouthFromMic();
  const k=.12;
  S.x+=(S.tx-S.x)*k;S.y+=(S.ty-S.y)*k;S.tilt+=(S.ttilt-S.tilt)*k;S.size+=(S.tsize-S.size)*k;
  S.mouth+=(S.tmouth-S.mouth)*.35;
  const breath=Math.sin((now-t0)/1200)*.008;
  const dx=S.x*160, dy=S.y*60, rot=S.tilt*28, sc=1+S.size*.5+breath;
  rig.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${sc})`;
  const b=S.blink;
  eyeL.classList.toggle('on',b);eyeR.classList.toggle('on',b);lidL.classList.toggle('on',b);lidR.classList.toggle('on',b);
  mO.classList.toggle('on',S.mouth>.55);mH.classList.toggle('on',S.mouth>.18&&S.mouth<=.55);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

(function(){
  if(window.top!==window.self){
    const p=document.getElementById('pop');p.style.display='inline-block';
    p.addEventListener('click',()=>{window.open(location.href,'_blank','noopener');});
    msg.textContent='このページは埋め込み表示のため、カメラが許可されない場合があります。「別タブで開く」を押してから「カメラを開始」を試してください。';
  }
})();

// ---- start ----
document.getElementById('start').addEventListener('click',async e=>{
  const btn=e.currentTarget;btn.disabled=true;msg.textContent='許可を待っています…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:true});
    video.srcObject=stream;await video.play();
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(stream);
      analyser=ac.createAnalyser();analyser.fftSize=512;buf=new Uint8Array(analyser.fftSize);src.connect(analyser);
    }catch(err){msg.textContent='マイクは使えませんでした（口は動きません）。';}
    base=null;btn.textContent='位置をリセット';btn.disabled=false;
    btn.onclick=()=>{base=null;msg.textContent='正面を向いた状態で基準をとり直しました。';};
    msg.textContent='追跡中。正面を向いて、左右に動いたり首を傾けたり、カメラに近づいてみてください。';
  }catch(err){
    btn.disabled=false;
    msg.textContent=(err&&err.name==='NotAllowedError')?'カメラの許可が得られませんでした。ブラウザのサイト設定からカメラとマイクを許可して、もう一度押してください。'
      :'カメラを開けませんでした（'+(err&&err.name||'不明なエラー')+'）。このページがiframe内で開かれている場合は、別タブで開くと動くことがあります。';
  }
});
</script>
